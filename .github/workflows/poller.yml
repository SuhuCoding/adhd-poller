name: Pengintai Perintah

on:
  schedule:
    - cron: '*/5 * * * *'     # cek tiap 5 menit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pengintai
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Cek perintah Telegram
        env:
          MATERI_BOT_TOKEN: ${{ secrets.MATERI_BOT_TOKEN }}
          ADHD_BOT_TOKEN: ${{ secrets.ADHD_BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          REPO_UMUM: ${{ secrets.REPO_UMUM }}
          REPO_ANAK: ${{ secrets.REPO_ANAK }}
          REPO_ORANGTUA: ${{ secrets.REPO_ORANGTUA }}
          REPO_VIDEO: ${{ secrets.REPO_VIDEO }}
        run: python3 poller.py
